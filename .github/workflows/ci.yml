name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bitly:
    name: Bitly example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/bitly

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run Docker Compose smoke test
        run: |
          trap 'docker compose down' EXIT
          docker compose up --build -d
          python scripts/smoke_test.py

  dropbox:
    name: Dropbox example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/dropbox

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run Docker Compose smoke test
        run: |
          trap 'docker compose down' EXIT
          docker compose up --build -d
          python scripts/smoke_test.py
