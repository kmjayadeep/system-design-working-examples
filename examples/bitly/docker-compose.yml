services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://bitly:bitly@postgres:5432/bitly
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
      COUNTER_XOR_SECRET: "11259375"
      CLEANUP_INTERVAL_SECONDS: "30"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bitly
      POSTGRES_PASSWORD: bitly
      POSTGRES_DB: bitly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitly -d bitly"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
