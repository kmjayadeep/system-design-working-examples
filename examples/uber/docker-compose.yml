services:
  api-a: &api
    build: .
    environment:
      DATABASE_URL: postgresql://uber:uber@postgres:5432/uber
      REDIS_URL: redis://redis:6379/0
      DRIVER_SEARCH_RADIUS_KM: "5"
      BASE_FARE: "5"
      PER_KM_FARE: "2.25"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-b:
    <<: *api

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8200:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uber
      POSTGRES_PASSWORD: uber
      POSTGRES_DB: uber
    ports:
      - "54320:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uber -d uber"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6400:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
